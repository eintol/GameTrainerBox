appId: com.gametrainerbox.desktop
productName: GameTrainerBox
directories:
  buildResources: build
files:
  - out/**
asarUnpack:
  - '**/*.node'
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: GameTrainerBox
